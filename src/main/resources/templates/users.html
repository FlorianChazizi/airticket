<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1>👥 Users Management</h1>
            
            <!-- ERROR -->
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            
            <!-- PLAIN FORM - NO th:field -->
            <form th:action="@{/users}" method="post" class="mb-4">
                <div class="input-group">
                    <input type="text" name="username" class="form-control" placeholder="New username" required maxlength="50">
                    <button class="btn btn-primary">Add User</button>
                </div>
            </form>
            
            <!-- USERS TABLE -->
            <table class="table table-striped">
                <thead>
                    <tr><th>ID</th><th>Username</th><th>Created</th></tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.username}"></td>
                        <td th:text="${#temporals.format(user.createdAt)}"></td>
                    </tr>
                    <tr th:if="${users == null or users.isEmpty()}">
                        <td colspan="3" class="text-center text-muted p-4">No users yet</td>
                    </tr>
                </tbody>
            </table>
            
            <a th:href="@{/}" class="btn btn-secondary">← Back to Booking</a>
        </div>
    </div>
</body>
</html>
